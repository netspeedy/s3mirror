name: GitHub Release

# Every release tag gets its GitHub release, with notes generated from the pull requests since the
# release before it. Container Image and Publish Homebrew Formula publish the same tag. The first
# release of a new line also archives the previous line's docs, for Deploy Pages Site to publish.
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to publish the GitHub release for, for example v1.0.4
        required: true
        type: string

concurrency:
  group: github-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}

      - name: Check the tag
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag like v1.0.4, got: ${RELEASE_REF}" >&2
            exit 1
          fi
          git fetch --tags --force
          git fetch origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" --force
          git merge-base --is-ancestor "$(git rev-parse "${RELEASE_REF}^{commit}")" "refs/remotes/origin/${DEFAULT_BRANCH}"

          echo "previous=$(bash scripts/release/previous-tag.sh "${RELEASE_REF}")" >> "${GITHUB_OUTPUT}"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_REF}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_REF}" --draft=false --latest
            printf "Release \`%s\` already existed; marked it published and latest.\n" "${RELEASE_REF}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          start=()
          if [ -n "${PREVIOUS_TAG}" ]; then
            start=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          gh release create "${RELEASE_REF}" \
            --verify-tag \
            --title "s3mirror ${RELEASE_REF}" \
            --generate-notes "${start[@]}" \
            --latest
          printf "Published the GitHub release for \`%s\`, with notes since \`%s\`.\n" \
            "${RELEASE_REF}" "${PREVIOUS_TAG:-the first commit}" >> "${GITHUB_STEP_SUMMARY}"

  # The first stable release of a new line (vX.Y.0) freezes the docs of the line before it. They're
  # rebuilt from the last commit before the new line's changes started, under /<repo>/vX.Y/, and
  # attached to that line's last release, where Deploy Pages Site picks them up. These jobs are in
  # this workflow, not a separate one, so the archive is attached before the workflow_run that
  # redeploys the site starts.
  docs-archive:
    name: Build Archived Docs
    needs:
      - release
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
      asset: ${{ steps.line.outputs.asset }}
      tag: ${{ steps.line.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}

      - name: Find the outgoing line
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          skip() {
            printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY}"
            echo "archive=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            skip "\`${RELEASE_REF}\` doesn't start a new line, so no docs are archived."
          fi

          git fetch --tags --force
          previous_tag="$(bash scripts/release/previous-tag.sh "${RELEASE_REF}")"
          if [ -z "${previous_tag}" ]; then
            skip "\`${RELEASE_REF}\` is the first release, so there's no earlier line to archive."
          fi
          line="$(sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/' <<<"${previous_tag}")"
          if ! gh release view "${previous_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            skip "\`${previous_tag}\` has no GitHub release to attach the ${line} docs to, so they aren't archived."
          fi

          commit="$(bash scripts/release/docs-archive-commit.sh "${previous_tag}" "${RELEASE_REF}")"
          site_dir="$(git ls-tree -r --name-only "${commit}" | sed -n 's|^\([^/]*\)/astro\.config\.mjs$|\1|p' | head -n1)"
          if [ -z "${site_dir}" ] || ! git show "${commit}:${site_dir}/astro.config.mjs" | grep -q SITE_ARCHIVE; then
            skip "The ${line} docs at \`${commit}\` predate versioned docs, so they aren't archived."
          fi

          git worktree add --detach archive-src "${commit}"
          {
            echo "archive=true"
            echo "line=${line}"
            echo "tag=${previous_tag}"
            echo "commit=${commit}"
            echo "site_dir=${site_dir}"
            echo "asset=${REPO_NAME}-docs-${line}.tar.gz"
          } >> "${GITHUB_OUTPUT}"

      # check-latest for the same reason as the Lint workflow: the Node 22 a runner has cached can be
      # older than the archived commit's Astro needs.
      - name: Set up Node.js
        if: steps.line.outputs.archive == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: archive-src/${{ steps.line.outputs.site_dir }}/package-lock.json

      - name: Write the archived docs' release details
        if: steps.line.outputs.archive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.line.outputs.tag }}
        run: |
          set -euo pipefail

          # The pages show the line's last release, as they did while it was the latest.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > archive-release.json
          jq -n --slurpfile latest_release archive-release.json \
            '{ latest_release: $latest_release[0] }' > "${RUNNER_TEMP}/archive-metadata.json"

      # A failed archive mustn't fail the release, which Deploy Pages Site waits on. The summary
      # says what happened, and website/README.md has the steps to build one by hand.
      - name: Build the archived docs
        id: build
        if: steps.line.outputs.archive == 'true'
        continue-on-error: true
        env:
          LINE: ${{ steps.line.outputs.line }}
          TAG: ${{ steps.line.outputs.tag }}
          COMMIT: ${{ steps.line.outputs.commit }}
          SITE_DIR: ${{ steps.line.outputs.site_dir }}
          ASSET: ${{ steps.line.outputs.asset }}
        run: |
          set -euo pipefail

          printf "Building the %s docs from \`%s\` for release \`%s\`.\n" "${LINE}" "${COMMIT}" "${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          npm ci --prefix "archive-src/${SITE_DIR}"
          export SITE_ARCHIVE="${LINE}" SITE_METADATA_FILE="${RUNNER_TEMP}/archive-metadata.json"
          make -C archive-src website-build website-check WEBSITE_DIR="${SITE_DIR}"
          tar -C "archive-src/${SITE_DIR}/dist" -czf "${ASSET}" .

          printf "Archived them as \`%s\`.\n" "${ASSET}" >> "${GITHUB_STEP_SUMMARY}"
          echo "built=true" >> "${GITHUB_OUTPUT}"

      - name: Report a failed archive
        if: steps.line.outputs.archive == 'true' && steps.build.outputs.built != 'true'
        run: |
          echo "::warning::The ${{ steps.line.outputs.line }} docs archive didn't build, so the line isn't published. See website/README.md to build it by hand."
          echo "The archive didn't build; see the step log. website/README.md has the steps to build it by hand." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload archived docs
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-archive
          path: ${{ steps.line.outputs.asset }}

  publish-docs-archive:
    name: Publish Archived Docs
    if: needs.docs-archive.outputs.built == 'true'
    needs:
      - docs-archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archived docs
        uses: actions/download-artifact@v8
        with:
          name: docs-archive

      - name: Attach them to the line's last release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.docs-archive.outputs.tag }}
          ASSET: ${{ needs.docs-archive.outputs.asset }}
        run: gh release upload "${TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
